name: Argonaut Test Lab

'on':
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
    inputs:
      gtk_only:
        description: Qualify only GTK at the approved Issue 18 source
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline-checks:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.gtk_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ARGONAUT_CI_JOB: argonaut-${{ github.run_id }}-offline-checks-normal-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build dependency-only image and record environment
        run: |
          set -euo pipefail
          mkdir -p ci-results
          uname -a > ci-results/environment.txt
          printf '%s\n' "${ImageOS:-unknown} ${ImageVersion:-unknown}" >> ci-results/environment.txt
          docker version >> ci-results/environment.txt
          docker info >> ci-results/environment.txt
          docker pull ubuntu:24.04 2>&1 | tee ci-results/base-pull.log
          docker image inspect ubuntu:24.04 > ci-results/base-image.json
          base=$(docker image inspect --format '{{index .RepoDigests 0}}' ubuntu:24.04)
          test -n "$base"
          # Dockerfile on stdin: no repository build context, COPY, or application execution.
          sed "s|^FROM ubuntu:24.04$|FROM $base|" tests/ci/Dockerfile | docker build --tag argonaut-ci:local - 2>&1 | tee ci-results/image-build.log
          docker image inspect argonaut-ci:local > ci-results/built-image.json
      - name: Audit explicit selections
        run: /usr/bin/python3 tests/run_ci_tests.py --audit --output ci-results
      - name: Run bounded suite with explicit Docker isolation
        run: /usr/bin/python3 tests/run_ci_tests.py --isolation docker --suite offline-checks --output ci-results
      - name: Independently remove job containers and verify absence
        if: always()
        run: |
          mkdir -p ci-results
          exec > >(tee -a ci-results/workflow-cleanup.log) 2>&1
          failed=0
          # A killed/timed-out create can register after an empty listing.
          # Retry independently, retaining uncertainty even if all listings are empty.
          attempts=1
          if [ -f ci-results/create-pending.json ]; then attempts=10; failed=1; fi
          for ((attempt=1; attempt<=attempts; attempt++)); do
            ids=$(timeout 20s docker ps -aq --filter "label=argonaut.ci-job=$ARGONAUT_CI_JOB") || { failed=1; ids=; }
            for id in $ids; do
              timeout 25s docker stop --time 10 "$id" || failed=1
              timeout 20s docker rm --force "$id" || failed=1
            done
            if [ "$attempts" -gt 1 ]; then sleep 1; fi
          done
          remaining=$(timeout 20s docker ps -aq --filter "label=argonaut.ci-job=$ARGONAUT_CI_JOB") || exit 1
          if [ -n "$remaining" ]; then failed=1; fi
          if [ -f ci-results/create-pending.json ]; then echo 'Creation unresolved; late daemon registration remains possible'; fi
          echo "Cleanup status: $failed; remaining: $remaining"
          exit "$failed"
      - name: Keep partial results and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-checks-${{ github.run_attempt }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  python-unit:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.gtk_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
