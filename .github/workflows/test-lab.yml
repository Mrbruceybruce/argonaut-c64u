          base=$(docker image inspect --format '{{index .RepoDigests 0}}' ubuntu:24.04)
          test -n "$base"
          # Dockerfile on stdin: no repository build context, COPY, or application execution.
          sed "s|^FROM ubuntu:24.04$|FROM $base|" tests/ci/Dockerfile | docker build --tag argonaut-ci:local - 2>&1 | tee ci-results/image-build.log
          docker image inspect argonaut-ci:local > ci-results/built-image.json
      - name: Audit explicit selections
        run: /usr/bin/python3 tests/run_ci_tests.py --audit --output ci-results
      - name: Run bounded suite with explicit Docker isolation
        env:
          CI_MODE: ${{ matrix.mode }}
        run: |
          flags=()
          if [ "$CI_MODE" = optimized ]; then flags+=(--optimized); fi
          /usr/bin/python3 tests/run_ci_tests.py --isolation docker --suite python-unit "${flags[@]}" --output ci-results
      - name: Independently remove job containers and verify absence
        if: always()
        run: |
          mkdir -p ci-results
          exec > >(tee -a ci-results/workflow-cleanup.log) 2>&1
          failed=0
          # A killed/timed-out create can register after an empty listing.
          # Retry independently, retaining uncertainty even if all listings are empty.
          attempts=1
          if [ -f ci-results/create-pending.json ]; then attempts=10; failed=1; fi
          for ((attempt=1; attempt<=attempts; attempt++)); do
            ids=$(timeout 20s docker ps -aq --filter "label=argonaut.ci-job=$ARGONAUT_CI_JOB") || { failed=1; ids=; }
            for id in $ids; do
