name: Argonaut Test Lab

'on':
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install replay test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      - name: Run deterministic Test Lab checks
        run: /usr/bin/python3 -m c64u_browser.test_lab --suite offline > test-lab-report.json
      - name: Run unit tests
        run: |
          /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py'
          /usr/bin/python3 -O -m unittest discover -s tests -p 'test_*.py'
      - name: Keep the Test Lab report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-lab-report
          path: test-lab-report.json
          if-no-files-found: warn
