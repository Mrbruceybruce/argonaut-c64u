        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-regression-${{ matrix.mode }}-${{ github.run_attempt }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  media-regression:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.gtk_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ARGONAUT_CI_JOB: argonaut-${{ github.run_id }}-media-regression-normal-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build dependency-only image and record environment
        run: |
          set -euo pipefail
          mkdir -p ci-results
          uname -a > ci-results/environment.txt
          printf '%s\n' "${ImageOS:-unknown} ${ImageVersion:-unknown}" >> ci-results/environment.txt
          docker version >> ci-results/environment.txt
          docker info >> ci-results/environment.txt
          docker pull ubuntu:24.04 2>&1 | tee ci-results/base-pull.log
          docker image inspect ubuntu:24.04 > ci-results/base-image.json
          base=$(docker image inspect --format '{{index .RepoDigests 0}}' ubuntu:24.04)
          test -n "$base"
          # Dockerfile on stdin: no repository build context, COPY, or application execution.
          sed "s|^FROM ubuntu:24.04$|FROM $base|" tests/ci/Dockerfile | docker build --tag argonaut-ci:local - 2>&1 | tee ci-results/image-build.log
          docker image inspect argonaut-ci:local > ci-results/built-image.json
      - name: Audit explicit selections
        run: /usr/bin/python3 tests/run_ci_tests.py --audit --output ci-results
      - name: Run bounded suite with explicit Docker isolation
        run: /usr/bin/python3 tests/run_ci_tests.py --isolation docker --suite media-regression --output ci-results
      - name: Independently remove job containers and verify absence
        if: always()
        run: |
          mkdir -p ci-results
          exec > >(tee -a ci-results/workflow-cleanup.log) 2>&1
          failed=0
          # A killed/timed-out create can register after an empty listing.
          # Retry independently, retaining uncertainty even if all listings are empty.
          attempts=1
          if [ -f ci-results/create-pending.json ]; then attempts=10; failed=1; fi
          for ((attempt=1; attempt<=attempts; attempt++)); do
            ids=$(timeout 20s docker ps -aq --filter "label=argonaut.ci-job=$ARGONAUT_CI_JOB") || { failed=1; ids=; }
            for id in $ids; do
              timeout 25s docker stop --time 10 "$id" || failed=1
              timeout 20s docker rm --force "$id" || failed=1
            done
            if [ "$attempts" -gt 1 ]; then sleep 1; fi
          done
          remaining=$(timeout 20s docker ps -aq --filter "label=argonaut.ci-job=$ARGONAUT_CI_JOB") || exit 1
          if [ -n "$remaining" ]; then failed=1; fi
          if [ -f ci-results/create-pending.json ]; then echo 'Creation unresolved; late daemon registration remains possible'; fi
          echo "Cleanup status: $failed; remaining: $remaining"
          exit "$failed"
      - name: Keep partial results and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: media-regression-${{ github.run_attempt }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  gtk-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ARGONAUT_CI_JOB: argonaut-${{ github.run_id }}-gtk-regression-normal-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.gtk_only && '56d9613f254bc5d0e6ae1ef9cd96fc39047d9adb' || '' }}
      - name: Verify and record approved qualification source
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.gtk_only }}
        env:
          EXPECTED_SOURCE_SHA: 56d9613f254bc5d0e6ae1ef9cd96fc39047d9adb
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          mkdir -p ci-results
          actual=$(git rev-parse HEAD)
          {
            printf 'expected_source_sha=%s\n' "$EXPECTED_SOURCE_SHA"
            printf 'actual_source_sha=%s\n' "$actual"
            printf 'workflow_sha=%s\n' "$WORKFLOW_SHA"
            printf 'workflow_ref=%s\n' "$WORKFLOW_REF"
            printf 'run_id=%s\nrun_attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } > ci-results/source-identity.txt
          test "$actual" = "$EXPECTED_SOURCE_SHA"
      - name: Build dependency-only image and record environment
        run: |
          set -euo pipefail
          mkdir -p ci-results
          uname -a > ci-results/environment.txt
          printf '%s\n' "${ImageOS:-unknown} ${ImageVersion:-unknown}" >> ci-results/environment.txt
          docker version >> ci-results/environment.txt
          docker info >> ci-results/environment.txt
          docker pull ubuntu:24.04 2>&1 | tee ci-results/base-pull.log
          docker image inspect ubuntu:24.04 > ci-results/base-image.json
          base=$(docker image inspect --format '{{index .RepoDigests 0}}' ubuntu:24.04)
          test -n "$base"
          # Dockerfile on stdin: no repository build context, COPY, or application execution.
          sed "s|^FROM ubuntu:24.04$|FROM $base|" tests/ci/Dockerfile | docker build --tag argonaut-ci:local - 2>&1 | tee ci-results/image-build.log
          docker image inspect argonaut-ci:local > ci-results/built-image.json
      - name: Audit explicit selections
        run: /usr/bin/python3 tests/run_ci_tests.py --audit --output ci-results
      - name: Run bounded suite with explicit Docker isolation
        run: /usr/bin/python3 tests/run_ci_tests.py --isolation docker --suite gtk-regression --output ci-results
      - name: Independently remove job containers and verify absence
        if: always()
        run: |
          mkdir -p ci-results
          exec > >(tee -a ci-results/workflow-cleanup.log) 2>&1
          failed=0
          # A killed/timed-out create can register after an empty listing.
          # Retry independently, retaining uncertainty even if all listings are empty.
          attempts=1
          if [ -f ci-results/create-pending.json ]; then attempts=10; failed=1; fi
          for ((attempt=1; attempt<=attempts; attempt++)); do
            ids=$(timeout 20s docker ps -aq --filter "label=argonaut.ci-job=$ARGONAUT_CI_JOB") || { failed=1; ids=; }
            for id in $ids; do
              timeout 25s docker stop --time 10 "$id" || failed=1
              timeout 20s docker rm --force "$id" || failed=1
            done
            if [ "$attempts" -gt 1 ]; then sleep 1; fi
          done
          remaining=$(timeout 20s docker ps -aq --filter "label=argonaut.ci-job=$ARGONAUT_CI_JOB") || exit 1
          if [ -n "$remaining" ]; then failed=1; fi
          if [ -f ci-results/create-pending.json ]; then echo 'Creation unresolved; late daemon registration remains possible'; fi
          echo "Cleanup status: $failed; remaining: $remaining"
          exit "$failed"
      - name: Keep partial results and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gtk-regression-${{ github.run_attempt }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  markdown-validation:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.gtk_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ARGONAUT_MD_JOB: argonaut-${{ github.run_id }}-markdown-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Acquire pinned dependencies and prepare tracked source
        run: |
          set -euo pipefail
          mkdir -p markdown-results "$RUNNER_TEMP/markdown-source"
          docker version > markdown-results/environment.txt
          # Minimal context: never send fixtures, credentials, Git metadata or application code.
          tar -C tools/markdown -cf - Dockerfile package.json package-lock.json |
            docker build --tag "$ARGONAUT_MD_JOB" - 2>&1 | tee markdown-results/build.log
          docker image inspect "$ARGONAUT_MD_JOB" > markdown-results/image.json
          git ls-files -z > "$RUNNER_TEMP/markdown-inventory"
          tar --null --verbatim-files-from -T "$RUNNER_TEMP/markdown-inventory" -cf - |
            tar -xf - -C "$RUNNER_TEMP/markdown-source"
          test "$(id -u)" -ne 0
      - name: Run tests and repeat validation offline
        run: |
          set -euo pipefail
          # A pending marker survives client interruption; independent cleanup fails closed.
          touch markdown-results/create-pending
          timeout 30s docker create --name "$ARGONAUT_MD_JOB" \
            --label "argonaut.markdown-job=$ARGONAUT_MD_JOB" \
            --network none --read-only --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges \
            --cpus 1 --memory 512m --memory-swap 512m --pids-limit 64 \
            --ulimit nofile=1024:1024 --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 \
            --mount "type=bind,src=$RUNNER_TEMP/markdown-source,dst=/source,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/markdown-inventory,dst=/inventory,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/markdown-results,dst=/results" \
            "$ARGONAUT_MD_JOB" sh -c '
              set -eu
              test "$(id -u)" -ne 0
              mkdir /tmp/tool
              cp /source/tools/markdown/check.mjs /source/tools/markdown/check.test.mjs /source/tools/markdown/policy.json /tmp/tool/
              ln -s /opt/markdown/node_modules /tmp/tool/node_modules
              node --version
              status=0
              node --test /tmp/tool/check.test.mjs > /results/tests.tap 2>&1 || status=1
              node /tmp/tool/check.mjs --root /source --inventory /inventory --json /results/first.json --github > /results/first.log 2>&1 || status=1
              node /tmp/tool/check.mjs --root /source --inventory /inventory --json /results/second.json > /results/second.log 2>&1 || status=1
              cmp /results/first.json /results/second.json || status=1
              cat /results/tests.tap /results/first.log
              exit "$status"
            ' > markdown-results/container-id
          rm markdown-results/create-pending
          docker inspect "$ARGONAUT_MD_JOB" > markdown-results/container.json
          timeout --signal=TERM --kill-after=15s 240s docker start --attach "$ARGONAUT_MD_JOB" 2>&1 | tee markdown-results/execution.log
          test "$(docker inspect --format '{{.State.ExitCode}}' "$ARGONAUT_MD_JOB")" = 0
      - name: Independently clean up Markdown containers
        if: always()
        run: |
          set -uo pipefail
          mkdir -p markdown-results
          exec > >(tee -a markdown-results/cleanup.log) 2>&1
          failed=0
          attempts=1
          if [ -f markdown-results/create-pending ]; then attempts=10; failed=1; fi
          for ((attempt=1; attempt<=attempts; attempt++)); do
            ids=$(timeout 20s docker ps -aq --filter "label=argonaut.markdown-job=$ARGONAUT_MD_JOB") || { failed=1; ids=; }
            for id in $ids; do
              timeout 20s docker inspect "$id" > markdown-results/final-container.json || failed=1
              timeout 20s docker logs "$id" > markdown-results/container.log 2>&1 || failed=1
              timeout 25s docker stop --time 10 "$id" || failed=1
              timeout 20s docker rm --force "$id" || failed=1
            done
            if [ "$attempts" -gt 1 ]; then sleep 1; fi
          done
          remaining=$(timeout 20s docker ps -aq --filter "label=argonaut.markdown-job=$ARGONAUT_MD_JOB") || exit 1
          if [ -n "$remaining" ]; then failed=1; fi
          if [ -f markdown-results/create-pending ]; then echo 'Creation unresolved; late daemon registration remains possible'; fi
          echo "Cleanup status: $failed; remaining: $remaining"
          exit "$failed"
      - name: Keep Markdown results including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: markdown-validation-${{ github.run_attempt }}
          path: markdown-results/
          retention-days: 14
          if-no-files-found: warn
