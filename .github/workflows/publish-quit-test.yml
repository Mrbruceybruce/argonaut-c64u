name: Publish verified Mac Quit test
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify both test builds and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 34759860294 --json conclusion,headSha > /tmp/quit-run.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/quit-run.json'))
          assert r['conclusion']=='success'
          assert r['headSha']=='590a15b3a38d13419f2759e6e4c3ee29e0921835'
          PY
          mkdir -p release
          for arch in AppleSilicon Intel; do
            gh run download 34759860294 --name "Argonaut-QuitTest-$arch" --dir "$arch"
            (cd "$arch" && sha256sum --check SHA256SUMS)
            cp "$arch"/*.dmg "$arch"/Argonaut*.zip release/
          done
          cp AppleSilicon/argonaut-quit-test-source.zip release/
          (cd release && sha256sum *.dmg *.zip > SHA256SUMS)
          cat > /tmp/quit-notes.md <<'NOTES'
          Mac Quit fix test for **macOS 15+**, with separate **Apple Silicon** and **Intel** downloads.

          Includes Yogi Bear / OldMan2525's [PR #3](https://github.com/Mrbruceybruce/argonaut-c64u/pull/3), plus normal window-close routing. The PR remains open pending hardware testing. This is a focused 0.1.4 test, without the newer local development features.

          Automated unit tests, packaged startup/media/About checks, Cmd-Q action registration, idle Quit, busy-operation Quit guard, relocation and signature checks passed on both Mac architectures. Physical Mac testing is still needed.

          Download the DMG matching your processor and drag Argonaut into Applications. Close other Argonaut copies before testing. Uses existing Argonaut profiles. About should show **0.1.4-quit-test.1**. Ad-hoc signed, not notarized; use the per-app Open Anyway option if macOS blocks this trusted download.

          Please test **Cmd-Q** and **Argonaut > Quit Argonaut** while idle, during preview, and during a file transfer. An active transfer should block quitting; retry after it finishes. Confirm the app can reopen normally.

          Exact prepared build source is in **argonaut-quit-test-source.zip**, including the close-routing and packaged-test adjustments. GitHub's automatic source archives reflect the PR base commit. GPL-3.0-or-later. Checksums included. Stable 0.1.4 remains the latest release.
          NOTES
          gh release create v0.1.4-quit-test.1 release/* --target 5afa6549700235ec09ba57135e847b091a96b1db --prerelease --latest=false --title "Argonaut 0.1.4 — Mac Quit fix test" --notes-file /tmp/quit-notes.md
