name: Windows test package
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows.yml'
      - 'packaging/windows/**'
      - 'tests/**'
      - 'c64u_browser/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
      - name: Unit tests
        shell: msys2 {0}
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build portable application
        shell: msys2 {0}
        run: |
          python -m PyInstaller --noconfirm --clean packaging/windows/argonaut.spec
          pacman -Q > dist/Argonaut/MSYS2-PACKAGES.txt
          cp LICENSE COPYRIGHT packaging/windows/README.txt dist/Argonaut/
      - name: Test packaged executable
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'argonaut-self-test.json'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\Argonaut\Argonaut.exe'
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test', $report) -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Startup test timed out' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Packaged startup failed' }
          Get-Content $report
      - uses: actions/upload-artifact@v4
        with:
          name: Argonaut-Windows-x64-test
          path: dist/Argonaut/
          if-no-files-found: error
