name: Publish tested macOS 0.1.2
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download and verify tested packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 34720749109 --json conclusion,headSha > /tmp/mac-run.json
          python3 - <<'PYTHON'
          import json
          r=json.load(open('/tmp/mac-run.json'))
          assert r['conclusion']=='success'
          assert r['headSha']=='69dd6cc6278bc84d3dbc9062a51eb743975dde8a'
          PYTHON
          gh run download 34720749109 --name Argonaut-macOS-AppleSilicon-test --dir artifacts
          sha256sum --check artifacts/SHA256SUMS
          mv artifacts/Argonaut-0.1.2-macOS-AppleSilicon-Test.dmg artifacts/Argonaut-0.1.2-macOS-AppleSilicon.dmg
          mv artifacts/Argonaut-0.1.2-macOS-AppleSilicon-Test.zip artifacts/Argonaut-0.1.2-macOS-AppleSilicon.zip
          cd artifacts
          sha256sum *.dmg *.zip > SHA256SUMS
      - name: Publish Mac downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.1.2 artifacts/* --target 69dd6cc6278bc84d3dbc9062a51eb743975dde8a --latest=false --title "Argonaut 0.1.2 — macOS Apple Silicon" --notes-file packaging/macos/RELEASE.md
