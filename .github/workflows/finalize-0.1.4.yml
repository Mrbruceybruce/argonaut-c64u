name: Finalize verified unified 0.1.4 release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify full package set and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.4 --dir release-assets
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          root=Path('release-assets')
          names={'Argonaut-0.1.4-macOS-AppleSilicon.dmg','Argonaut-0.1.4-macOS-AppleSilicon.zip','Argonaut-0.1.4-Windows-x64-Portable.zip','Argonaut-0.1.4-Windows-x64-Setup.exe','argonaut-0.1.4.tar.gz','argonaut-c64u_0.1.4_all.deb'}
          assert {p.name for p in root.iterdir()}==names
          assert hashlib.sha256((root/'argonaut-c64u_0.1.4_all.deb').read_bytes()).hexdigest()=='fcbc405c25a19e20600184fe4f381cbfee3aed06ff7de75b29fb94925d5623dd'
          lines=[]
          for name in sorted(names):
              lines.append(hashlib.sha256((root/name).read_bytes()).hexdigest()+'  '+name+'\n')
          (root/'SHA256SUMS').write_text(''.join(lines))
          print(''.join(lines))
          PYTHON
          gh release upload v0.1.4 release-assets/SHA256SUMS
          gh release edit v0.1.4 --draft=false --latest
