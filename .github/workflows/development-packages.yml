name: Development Windows and Mac packages
'on':
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified packages as the v1.5-ai.1 prerelease
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: development
    - id: source
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.source.outputs.sha }}
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-python-gobject mingw-w64-ucrt-x86_64-gtk4 mingw-w64-ucrt-x86_64-pyinstaller
          mingw-w64-ucrt-x86_64-gst-plugins-base mingw-w64-ucrt-x86_64-gst-plugins-good mingw-w64-ucrt-x86_64-gst-plugins-bad mingw-w64-ucrt-x86_64-adwaita-icon-theme
    - name: Unit tests
      shell: msys2 {0}
      run: python -m unittest discover -s tests -p 'test_*.py'
    - name: Build portable application
      shell: msys2 {0}
      run: |
        python packaging/build_metadata.py --version 1.5-ai.1 --development
        python -m PyInstaller --noconfirm --clean packaging/windows/argonaut.spec
        pacman -Q > dist/Argonaut/MSYS2-PACKAGES.txt
        cp LICENSE COPYRIGHT packaging/windows/README.txt dist/Argonaut/
    - name: Test packaged executable
      shell: pwsh
      run: |
        $report = Join-Path $env:RUNNER_TEMP 'argonaut-self-test.json'
        $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\Argonaut\Argonaut.exe'
        $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
        $process = Start-Process -FilePath $exe -ArgumentList @('--self-test', $report) -PassThru
        if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Startup test timed out' }
        if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Packaged startup failed' }
        $result = Get-Content $report | ConvertFrom-Json
        if ($result.result -ne 'passed' -or $result.suite -ne 'package') { throw 'Package self-test did not pass' }
        Get-Content $report
    - name: Package and test portable development app
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force artifacts | Out-Null
        $bundle = Join-Path $env:GITHUB_WORKSPACE 'dist/Argonaut'
        New-Item -ItemType File "$bundle/portable.flag" | Out-Null
        Copy-Item docs/DEVELOPMENT-TEST.md "$bundle/README-DEVELOPMENT.md"
        $report = Join-Path $env:RUNNER_TEMP 'portable-dev-test.json'
        $p = Start-Process "$bundle/Argonaut.exe" -ArgumentList @('--self-test', $report) -PassThru
        if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Portable test timeout' }
        if ($p.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Portable test failed' }
        $result = Get-Content $report | ConvertFrom-Json
        if ($result.result -ne 'passed' -or $result.suite -ne 'package') { throw 'Portable self-test did not pass' }
        if (-not (Test-Path "$bundle/Data/argonaut-development/config.json")) { throw 'Development preferences missing' }
        Copy-Item $report artifacts/package-self-test-Windows.json
        Remove-Item "$bundle/Data" -Recurse -Force
        Compress-Archive -Path "$bundle/*" -DestinationPath artifacts/Argonaut-1.5-ai.1-Windows-x64-Portable.zip
    - uses: actions/upload-artifact@v4
      with:
        name: dev-Windows
        path: artifacts/
        if-no-files-found: error
    needs: source
  macos:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.source.outputs.sha }}
    - name: Install Mac runtime
      run: |
        test "$(uname -m)" = "${{ matrix.arch }}"
        # The hosted Intel image includes python.org symlinks that conflict
        # with Homebrew. Preserve these links outside PATH on this disposable VM.
        mkdir -p "$RUNNER_TEMP/python-links"
        for name in idle3.13 pip3.13 pydoc3.13 python3.13 python3.13-config; do
          link="/usr/local/bin/$name"
          if [ -L "$link" ]; then
            mv "$link" "$RUNNER_TEMP/python-links/$name"
          fi
        done
        brew install python@3.13 pygobject3 gtk4 gstreamer adwaita-icon-theme
        "$(brew --prefix python@3.13)/bin/python3.13" -m venv --system-site-packages .venv
        .venv/bin/python -m pip install pyinstaller keyring
        .venv/bin/python -c "import gi; gi.require_version('Gtk','4.0'); from gi.repository import Gtk"
    - name: Unit tests
      run: .venv/bin/python -m unittest discover -s tests -p 'test_*.py'
    - name: Build app
      run: |
        .venv/bin/python packaging/build_metadata.py --version 1.5-ai.1 --development
        .venv/bin/python -m PyInstaller --noconfirm --clean packaging/macos/argonaut.spec
    - name: Check relocated app with minimal environment
      run: |
        mkdir -p "$RUNNER_TEMP/Argonaut App Test"
        ditto "dist/Argonaut Development.app" "$RUNNER_TEMP/Argonaut App Test/Argonaut Development.app"
        codesign --verify --deep --strict "$RUNNER_TEMP/Argonaut App Test/Argonaut Development.app"
        .venv/bin/python - <<'PYTHON'
        import json, os, subprocess
        from pathlib import Path
        folder=Path(os.environ['RUNNER_TEMP'])/'Argonaut App Test'
        report=folder/'self-test.json'
        env=dict(os.environ,PATH='/usr/bin:/bin:/usr/sbin:/sbin')
        for key in ('PYTHONPATH','GI_TYPELIB_PATH','DYLD_LIBRARY_PATH','GST_PLUGIN_PATH'):
            env.pop(key,None)
        subprocess.run([str(folder/'Argonaut Development.app/Contents/MacOS/Argonaut'),'--self-test',str(report)],env=env,check=True,timeout=90)
        if not report.is_file():
            raise SystemExit('Package self-test report is missing')
        result=json.loads(report.read_text())
        if result.get('result')!='passed' or result.get('suite')!='package':
            raise SystemExit('Package self-test did not pass')
        print(report.read_text())
        PYTHON
    - name: Create development DMG and ZIP
      run: |
        mkdir -p mac-package artifacts
        ditto "dist/Argonaut Development.app" "mac-package/Argonaut Development.app"
        cp docs/DEVELOPMENT-TEST.md LICENSE COPYRIGHT mac-package/
        brew info --json=v2 --installed > mac-package/Homebrew-packages.json
        ln -s /Applications mac-package/Applications
        hdiutil create -volname 'Argonaut Development' -srcfolder mac-package -ov -format UDZO artifacts/Argonaut-1.5-ai.1-macOS-${{ matrix.label }}.dmg
        ditto -c -k --sequesterRsrc --keepParent mac-package artifacts/Argonaut-1.5-ai.1-macOS-${{ matrix.label }}.zip
        cp "$RUNNER_TEMP/Argonaut App Test/self-test.json" "artifacts/package-self-test-macOS-${{ matrix.label }}.json"
    - uses: actions/upload-artifact@v4
      with:
        name: dev-macOS-${{ matrix.label }}
        path: artifacts/
        if-no-files-found: error
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-15
          arch: arm64
          label: AppleSilicon
        - runner: macos-15-intel
          arch: x86_64
          label: Intel
  publish:
    if: ${{ inputs.publish }}
    needs:
    - source
    - windows
    - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ needs.source.outputs.sha }}
    - uses: actions/download-artifact@v4
      with:
        pattern: dev-*
        path: release-assets
        merge-multiple: true
    - name: Publish verified development packages
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git archive --format=zip --prefix=argonaut-development/ -o release-assets/argonaut-1.5-ai.1-source.zip HEAD
        cd release-assets
        sha256sum *.zip *.dmg > SHA256SUMS
        gh release create v1.5-ai.1 --target "${{ needs.source.outputs.sha }}" --prerelease --latest=false --title 'Argonaut 1.5-ai.1 — Development test packages' --notes-file ../docs/DEVELOPMENT-TEST.md *.zip *.dmg SHA256SUMS
