name: Build stable 1.8 candidate
env:
  ARGONAUT_VERSION: '1.8'
'on':
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified packages as stable 1.8
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: development
    - id: source
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  windows:
    needs: source
    runs-on: windows-2022
    env:
      ARGONAUT_SOURCE_COMMIT: ${{ needs.source.outputs.sha }}
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: ${{ needs.source.outputs.sha }}
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-python-gobject mingw-w64-ucrt-x86_64-gtk4 mingw-w64-ucrt-x86_64-pyinstaller
          mingw-w64-ucrt-x86_64-gst-plugins-base mingw-w64-ucrt-x86_64-gst-plugins-good mingw-w64-ucrt-x86_64-gst-plugins-bad mingw-w64-ucrt-x86_64-adwaita-icon-theme
    - name: Unit tests
      shell: msys2 {0}
      run: python -m unittest discover -s tests -p 'test_*.py'
    - name: Build portable application
      shell: msys2 {0}
      run: |
        python packaging/build_metadata.py --version ${{ env.ARGONAUT_VERSION }}
        python -m PyInstaller --noconfirm --clean packaging/windows/argonaut.spec
        pacman -Q > dist/Argonaut/MSYS2-PACKAGES.txt
        cp LICENSE COPYRIGHT packaging/windows/README.txt dist/Argonaut/
    - name: Test packaged executable
      shell: pwsh
      run: |
        $report = Join-Path $env:RUNNER_TEMP 'argonaut-self-test.json'
        $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\Argonaut\Argonaut.exe'
        $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
        $process = Start-Process -FilePath $exe -ArgumentList @('--self-test', $report) -PassThru
        if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Startup test timed out' }
        if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Packaged startup failed' }
        $result = Get-Content $report | ConvertFrom-Json
        if ($result.result -ne 'passed' -or $result.suite -ne 'package' -or $result.build -ne $env:ARGONAUT_SOURCE_COMMIT) { throw 'Package self-test did not pass' }
        Get-Content $report
    - name: Build installer and portable ZIP; test install and uninstall
      shell: pwsh
      run: ./packaging/windows/package.ps1
    - uses: actions/upload-artifact@v7
      with:
        name: stable-Windows
        path: release-assets/
        if-no-files-found: error
  macos:
    needs: source
    runs-on: ${{ matrix.runner }}
    env:
      ARGONAUT_SOURCE_COMMIT: ${{ needs.source.outputs.sha }}
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: ${{ needs.source.outputs.sha }}
    - name: Install Mac runtime
      run: |
        test "$(uname -m)" = "${{ matrix.arch }}"
        # The hosted Intel image includes python.org symlinks that conflict
        # with Homebrew. Preserve these links outside PATH on this disposable VM.
        mkdir -p "$RUNNER_TEMP/python-links"
        for name in idle3.13 pip3.13 pydoc3.13 python3.13 python3.13-config; do
          link="/usr/local/bin/$name"
          if [ -L "$link" ]; then
            mv "$link" "$RUNNER_TEMP/python-links/$name"
          fi
        done
        brew install python@3.13 pygobject3 gtk4 gstreamer adwaita-icon-theme
        "$(brew --prefix python@3.13)/bin/python3.13" -m venv --system-site-packages .venv
        .venv/bin/python -m pip install pyinstaller keyring
        .venv/bin/python -c "import gi; gi.require_version('Gtk','4.0'); from gi.repository import Gtk"
    - name: Unit tests
      run: .venv/bin/python -m unittest discover -s tests -p 'test_*.py'
    - name: Build app
      run: |
        .venv/bin/python packaging/build_metadata.py --version ${{ env.ARGONAUT_VERSION }}
        .venv/bin/python -m PyInstaller --noconfirm --clean packaging/macos/argonaut.spec
    - name: Check relocated app with minimal environment
      run: |
        mkdir -p "$RUNNER_TEMP/Argonaut App Test"
        ditto "dist/Argonaut.app" "$RUNNER_TEMP/Argonaut App Test/Argonaut.app"
        codesign --verify --deep --strict "$RUNNER_TEMP/Argonaut App Test/Argonaut.app"
        .venv/bin/python - <<'PYTHON'
        import json, os, subprocess
        from pathlib import Path
        folder=Path(os.environ['RUNNER_TEMP'])/'Argonaut App Test'
        report=folder/'self-test.json'
        env=dict(os.environ,PATH='/usr/bin:/bin:/usr/sbin:/sbin')
        for key in ('PYTHONPATH','GI_TYPELIB_PATH','DYLD_LIBRARY_PATH','GST_PLUGIN_PATH'):
            env.pop(key,None)
        subprocess.run([str(folder/'Argonaut.app/Contents/MacOS/Argonaut'),'--self-test',str(report)],env=env,check=True,timeout=180)
        if not report.is_file():
            raise SystemExit('Package self-test report is missing')
        result=json.loads(report.read_text())
        if (result.get('result')!='passed' or result.get('suite')!='package' or
                result.get('build')!=os.environ['ARGONAUT_SOURCE_COMMIT']):
            raise SystemExit('Package self-test did not pass')
        print(report.read_text())
        PYTHON
    - name: Create stable DMG and ZIP
      run: |
        mkdir -p mac-package artifacts
        ditto "dist/Argonaut.app" "mac-package/Argonaut.app"
        cp packaging/RELEASE-1.8.md LICENSE COPYRIGHT mac-package/
        brew info --json=v2 --installed > mac-package/Homebrew-packages.json
        ln -s /Applications mac-package/Applications
        hdiutil create -volname 'Argonaut' -srcfolder mac-package -ov -format UDZO artifacts/Argonaut-${{ env.ARGONAUT_VERSION }}-macOS-${{ matrix.label }}.dmg
        ditto -c -k --sequesterRsrc --keepParent mac-package artifacts/Argonaut-${{ env.ARGONAUT_VERSION }}-macOS-${{ matrix.label }}.zip
    - uses: actions/upload-artifact@v7
      with:
        name: stable-macOS-${{ matrix.label }}
        path: artifacts/
        if-no-files-found: error
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-15
          arch: arm64
          label: AppleSilicon
        - runner: macos-15-intel
          arch: x86_64
          label: Intel
  publish:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: ${{ needs.source.outputs.sha }}
    - uses: actions/download-artifact@v8
      with:
        pattern: stable-*
        path: release-assets
        merge-multiple: true
    - name: Publish verified stable packages
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git archive --format=zip --prefix="argonaut-${ARGONAUT_VERSION}/" -o "/tmp/argonaut-${ARGONAUT_VERSION}-source.zip" HEAD
        cp "/tmp/argonaut-${ARGONAUT_VERSION}-source.zip" release-assets/
        cd release-assets
        python3 - <<'VERIFY'
        from pathlib import Path
        import hashlib
        expected={'Argonaut-1.8-Windows-x64-Setup.exe','Argonaut-1.8-Windows-x64-Portable.zip','Argonaut-1.8-macOS-AppleSilicon.dmg','Argonaut-1.8-macOS-AppleSilicon.zip','Argonaut-1.8-macOS-Intel.dmg','Argonaut-1.8-macOS-Intel.zip','argonaut-c64u_1.8_all.deb','argonaut-1.8-source.zip'}
        actual={p.name for p in Path('.').iterdir() if p.name!='SHA256SUMS'}
        if actual != expected:
            raise SystemExit(f'Unexpected release files: expected {sorted(expected)}, got {sorted(actual)}')
        Path('SHA256SUMS').write_text(''.join(hashlib.sha256(Path(n).read_bytes()).hexdigest()+'  '+n+'\n' for n in sorted(expected)))
        VERIFY
        gh release create v1.8 --target "${{ needs.source.outputs.sha }}" --latest --title 'Argonaut 1.8 — Debian, Windows and macOS' --notes-file ../packaging/RELEASE-1.8.md *.deb *.exe *.zip *.dmg SHA256SUMS
    needs:
    - source
    - windows
    - macos
    - debian
  debian:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ARGONAUT_SOURCE_COMMIT: ${{ needs.source.outputs.sha }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: ${{ needs.source.outputs.sha }}
    - name: Install GTK test runtime
      run: |-
        sudo apt-get update
        sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-secret-1 gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad iproute2 adwaita-icon-theme xvfb dbus-x11
    - name: Unit and GTK tests
      run: |-
        python3 -m unittest discover -s tests -p 'test_*.py'
        python3 -O -m unittest discover -s tests -p 'test_*.py'
        xvfb-run -a env ARGONAUT_UI_TESTS=1 python3 -m unittest tests.test_preferences_ui
    - name: Build and test installed package
      run: |-
        python3 packaging/build_deb.py --version "${ARGONAUT_VERSION}" --output release-assets
        sudo apt-get install -y "./release-assets/argonaut-c64u_${ARGONAUT_VERSION}_all.deb"
        cd /tmp
        xvfb-run -a /usr/bin/argonaut --self-test /tmp/debian-test.json
        python3 - <<'PYTHON'
        import json, os
        from pathlib import Path
        report=Path('/tmp/debian-test.json')
        if not report.is_file():
            raise SystemExit('Package self-test report is missing')
        result=json.loads(report.read_text())
        if (result.get('result')!='passed' or result.get('suite')!='package' or
                result.get('version')!=os.environ['ARGONAUT_VERSION'] or
                result.get('build')!=os.environ['ARGONAUT_SOURCE_COMMIT']):
            raise SystemExit('Package self-test did not pass')
        PYTHON
        cat /tmp/debian-test.json
    - uses: actions/upload-artifact@v7
      with:
        name: stable-Debian
        path: release-assets/*.deb
        if-no-files-found: error
