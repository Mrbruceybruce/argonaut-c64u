name: macOS Quit fix test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            label: AppleSilicon
          - runner: macos-15-intel
            arch: x86_64
            label: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/3/head
          persist-credentials: false
      - name: Verify reviewed source and prepare Quit test
        run: |
          test "$(git rev-parse HEAD)" = 5afa6549700235ec09ba57135e847b091a96b1db
          python3 - <<'PY'
          from pathlib import Path
          p=Path('c64u_browser/gui.py')
          s=p.read_text().replace("quit_action.connect('activate', lambda *_: self.close())", "quit_action.connect('activate', self.request_quit)")
          # Normalize indentation to the same implementation tested locally.
          method='    def request_quit(self,*_):\n        window=getattr(self,\'window\',None)\n        if window is not None:\n            window.close()\n        else:\n            self.pool.shutdown(wait=False)\n            self.quit()\n\n'
          s=s.replace('    def do_activate(self):',method+'    def do_activate(self):',1)
          p.write_text(s)
          p=Path('packaging/windows/launch.py');s=p.read_text()
          s=s.replace("build_info()['version']=='0.1.4'", "build_info()['version']=='0.1.4-quit-test.1'")
          s=s.replace('  app.recovery.close();app.window.close();app.quit()', '''  assert app.lookup_action('quit').get_enabled()
            assert app.get_accels_for_action('app.quit')==['<Meta>q']
            app.busy=True
            app.activate_action('quit',None)
            assert app.window in app.get_windows()
            assert not app.pool._shutdown
            app.busy=False
            app.activate_action('quit',None)
            assert app.pool._shutdown
            assert app.window not in app.get_windows()''')
          p.write_text(s)
          Path('QUIT-TEST.txt').write_text('Argonaut 0.1.4 Quit test for macOS 15+.\nIncludes Yogi Bear / OldMan2525 PR #3, with normal window-close routing.\nTest Cmd-Q and Argonaut > Quit when idle and during a transfer.\nBusy transfers should block quitting. Check preview shutdown too.\nClose other Argonaut copies before testing. Uses your existing profiles.\nAd-hoc signed, not notarized. Physical Mac testing is still required.\n')
          PY
      - name: Install runtime
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          if [ '${{ matrix.arch }}' = x86_64 ]; then
            mkdir -p "$RUNNER_TEMP/python-links"
            for name in idle3.13 pip3.13 pydoc3.13 python3.13 python3.13-config; do
              link="/usr/local/bin/$name"
              if [ -L "$link" ]; then mv "$link" "$RUNNER_TEMP/python-links/$name"; fi
            done
          fi
          brew install python@3.13 pygobject3 gtk4 gstreamer adwaita-icon-theme
          "$(brew --prefix python@3.13)/bin/python3.13" -m venv --system-site-packages .venv
          .venv/bin/python -m pip install pyinstaller keyring
      - name: Test and build
        run: |
          .venv/bin/python -m unittest discover -s tests -p 'test_*.py'
          .venv/bin/python packaging/build_metadata.py --version 0.1.4-quit-test.1
          .venv/bin/python -m PyInstaller --noconfirm --clean packaging/macos/argonaut.spec
      - name: Verify relocated package and Quit action
        run: |
          mkdir -p "$RUNNER_TEMP/Argonaut Quit Test"
          ditto dist/Argonaut.app "$RUNNER_TEMP/Argonaut Quit Test/Argonaut.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/Argonaut Quit Test/Argonaut.app"
          .venv/bin/python - <<'PY'
          import os,subprocess
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])/'Argonaut Quit Test'
          env=dict(os.environ,PATH='/usr/bin:/bin:/usr/sbin:/sbin')
          for key in ('PYTHONPATH','GI_TYPELIB_PATH','DYLD_LIBRARY_PATH','GST_PLUGIN_PATH'):env.pop(key,None)
          subprocess.run([str(folder/'Argonaut.app/Contents/MacOS/Argonaut'),'--self-test',str(folder/'report.json')],env=env,check=True,timeout=90)
          print((folder/'report.json').read_text())
          PY
      - name: Package tested build and exact source
        run: |
          mkdir -p mac-package artifacts
          ditto dist/Argonaut.app mac-package/Argonaut.app
          cp QUIT-TEST.txt LICENSE COPYRIGHT mac-package/
          brew info --json=v2 --installed > mac-package/Homebrew-packages.json
          ln -s /Applications mac-package/Applications
          hdiutil create -volname 'Argonaut Quit Test' -srcfolder mac-package -ov -format UDZO artifacts/Argonaut-0.1.4-QuitTest-macOS-${{ matrix.label }}.dmg
          ditto -c -k --sequesterRsrc --keepParent mac-package artifacts/Argonaut-0.1.4-QuitTest-macOS-${{ matrix.label }}.zip
          .venv/bin/python - <<'PY'
          import subprocess,zipfile
          from pathlib import Path
          with zipfile.ZipFile('artifacts/argonaut-quit-test-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
              for name in names+['c64u_browser/_build.json','QUIT-TEST.txt']:
                  if name and Path(name).is_file():archive.write(name,'argonaut-quit-test/'+name)
          PY
          (cd artifacts && shasum -a 256 *.dmg *.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: Argonaut-QuitTest-${{ matrix.label }}
          path: artifacts/
          if-no-files-found: error
